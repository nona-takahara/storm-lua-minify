name: Publish

# npmのTrusted Publishing(OIDC)でnpmへ公開する。長期トークンは使わない。
# vX.Y.Z形式のタグをpushすると、検証を通った場合にだけ公開する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npmjs.comのTrusted Publisherに登録する環境名と一致させる
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDCトークンの発行に必須。公開ジョブだけに付ける
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: "pnpm"

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} が package.json の version (v${version}) と一致しません"
            exit 1
          fi

      # Trusted Publishingにはnpm 11.5.1以上が必要
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # provenanceはTrusted Publishingで自動的に付く。prepackでビルドされる
      - name: Publish
        run: npm publish
